<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="glossary.title"></title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="../i18n/i18n.js" defer></script>
</head>
<body>

    <div class="cheat-sheet">
        <div class="header">
            <span class="subtitle-top" data-i18n="common.the"></span>
            <h1 data-i18n="common.wildsea"></h1>
            <div class="divider"><i class="fa-solid fa-book-journal-whills"></i></div>
            <div class="subtitle-bottom" data-i18n="glossary.subtitle_bottom"></div>
            <h2 data-i18n="glossary.h2"></h2>
            <div class="lang-switch">
                <button type="button" class="lang-btn" data-lang-button="es" data-i18n-attr="aria-label:common.lang_es">
                    <img src="../img/flag-es.svg" alt="">
                </button>
                <button type="button" class="lang-btn" data-lang-button="en" data-i18n-attr="aria-label:common.lang_en">
                    <img src="../img/flag-en.svg" alt="">
                </button>
            </div>
        </div>



        <!-- Section 0 -->
        <div class="card">
            <div class="card-left">
                <div class="number">1</div>
                <div class="card-icon"><i class="fa-solid fa-scroll"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="glossary.card1_title"></h3>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-burst"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card1_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-biohazard"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card1_item2"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-fire"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card1_item3"></div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="card">
            <div class="card-left">
                <div class="number">2</div>
                <div class="card-icon"><i class="fa-solid fa-ghost"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="glossary.card2_title"></h3>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-person-falling"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card2_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-eye"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card2_item2"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-wine-glass"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card2_item3"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-cross"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card2_item4"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-shirt"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card2_item5"></div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="card">
            <div class="card-left">
                <div class="number">3</div>
                <div class="card-icon"><i class="fa-solid fa-tree"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="glossary.card3_title"></h3>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-leaf"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card3_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-layer-group"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card3_item2"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-brands fa-pagelines"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card3_item3"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-water"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card3_item4"></div>
                    </li>
                    <li>

                    <li>

                    <li>
                        <div class="info-icon"><i class="fa-solid fa-mountain"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card3_item8"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-gem"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card3_item9"></div>

                    <li>

                        <div class="info-content" data-i18n-html="glossary.card3_item10"></div>
                    </li>
                </ul>
            </div>
        </div>

        <div class="card">
            <div class="card-left">
                <div class="number">4</div>
                <div class="card-icon"><i class="fa-solid fa-sailboat"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="glossary.card4_title"></h3>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-users-viewfinder"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-compass"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item2"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-mask-face"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item3"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-shoe-prints"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item4"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-weight-hanging"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item5"></div>

                    <li>

                        <div class="info-content" data-i18n-html="glossary.card4_item6"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-binoculars"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item7"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-location-arrow"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card4_item8"></div>
                    </li>
                </ul>
            </div>

        <!-- Section 3 -->
        <div class="card">
            <div class="card-left">
                <div class="number">5</div>
                <div class="card-icon"><i class="fa-solid fa-dna"></i></div>

            <div class="card-right">
                <h3 class="card-title" data-i18n="glossary.card5_title"></h3>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-fire"></i></div>

                        <div class="info-icon"><i class="fa-brands fa-pagelines"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card5_item2"></div>

                    <li>

                    <li>
                        <div class="info-icon"><i class="fa-solid fa-spider"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card5_item4"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-robot"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card5_item5"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-skull"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card5_item6"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-bug"></i></div>
                        <div class="info-content" data-i18n-html="glossary.card5_item7"></div>
                    </li>
                </ul>
            </div>
        </div>

    </div>


        <div class="back-nav">
            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                <span data-i18n="common.back_index">Índice</span>
            </a>
        </div>
