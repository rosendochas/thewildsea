<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="bloodlines.title"></title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="../i18n/i18n.js" defer></script>
</head>
<body>

    <div class="cheat-sheet">
        <div class="header">
            <span class="subtitle-top" data-i18n="common.the"></span>
            <h1 data-i18n="common.wildsea"></h1>
            <div class="divider"><i class="fa-solid fa-dna"></i></div>
            <div class="subtitle-bottom" data-i18n="bloodlines.subtitle_bottom"></div>
            <h2 data-i18n="bloodlines.h2"></h2>
            <div class="lang-switch">
                <button type="button" class="lang-btn" data-lang-button="es" data-i18n-attr="aria-label:common.lang_es">
                    <img src="../img/flag-es.svg" alt="">
                </button>
                <button type="button" class="lang-btn" data-lang-button="en" data-i18n-attr="aria-label:common.lang_en">
                    <img src="../img/flag-en.svg" alt="">
                </button>
            </div>
        </div>



                <!-- Bloodlines Image -->
        <div class="card">
            <div class="card-left">
            </div>
            <div class="card-right">
                <img src="../img/bloodlines.png" style="width:100%; border-radius: 8px; display: block;" data-i18n-attr="alt:bloodlines.image_alt">
            </div>
        </div>


        <!-- Section 1: Las Cuatro Núcleo -->
        <div class="card">
            <div class="card-left">
                <div class="number">1</div>
                <div class="card-icon"><i class="fa-solid fa-star"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="bloodlines.card1_title"></h3>
                <p class="intro-text" data-i18n="bloodlines.card1_intro"></p>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-fire"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card1_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-leaf"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card1_item2"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-seedling"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card1_item3"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-spider"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card1_item4"></div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Section 2: Las Tres Emergentes -->
        <div class="card">
            <div class="card-left">
                <div class="number">2</div>
                <div class="card-icon"><i class="fa-solid fa-angles-up"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="bloodlines.card2_title"></h3>
                <p class="intro-text" data-i18n="bloodlines.card2_intro"></p>
                
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-robot"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card2_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-skull"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card2_item2"></div>
                    </li>
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-feather"></i></div>
                        <div class="info-content" data-i18n-html="bloodlines.card2_item3"></div>
                    </li>
                </ul>
            </div>
        </div>


    </div>


        <div class="back-nav">
            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                <span data-i18n="common.back_index">Índice</span>
            </a>
        </div>

</body>
</html>
