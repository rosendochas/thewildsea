<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="rolls.title"></title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles.css">
    <script src="../i18n/i18n.js" defer></script>
</head>
<body>

    <div class="cheat-sheet">
        <div class="header">
            <span class="subtitle-top" data-i18n="common.the"></span>
            <h1 data-i18n="common.wildsea"></h1>
            <div class="divider"><i class="fa-solid fa-compass"></i></div>
            <div class="subtitle-bottom" data-i18n="rolls.subtitle_bottom"></div>
            <h2 data-i18n="rolls.h2"></h2>
            <div class="lang-switch">
                <button type="button" class="lang-btn" data-lang-button="es" data-i18n-attr="aria-label:common.lang_es">
                    <img src="../img/flag-es.svg" alt="">
                </button>
                <button type="button" class="lang-btn" data-lang-button="en" data-i18n-attr="aria-label:common.lang_en">
                    <img src="../img/flag-en.svg" alt="">
                </button>
            </div>
        </div>



        <!-- Section 1 -->
        <div class="card">
            <div class="card-left">
                <div class="number">1</div>
                <div class="card-icon"><i class="fa-solid fa-dice"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="rolls.card1_title"></h3>
                <p data-i18n="rolls.card1_intro"></p>
                
                <div class="formula-box" data-i18n-html="rolls.card1_formula"></div>

                <ul class="info-list">
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-user-large"></i></div>
                        <div data-i18n="rolls.card1_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon"><i class="fa-solid fa-box-open"></i></div>
                        <div data-i18n="rolls.card1_item2"></div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Section 2 -->
        <div class="card">
            <div class="card-left">
                <div class="number">2</div>
                <div class="card-icon"><i class="fa-solid fa-gear"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="rolls.card2_title"></h3>
                <div class="corte-layout">
                    <div class="corte-text">
                        <ul>
                            <li data-i18n-html="rolls.card2_rule1"></li>
                            <li data-i18n-html="rolls.card2_rule2"></li>
                        </ul>
                    </div>
                    <div class="impact-tracks">
                        <div class="track">
                            <div class="track-label" data-i18n-html="rolls.card2_track1"></div>
                            <div class="boxes">
                                <div class="box filled"></div><div class="box"></div><div class="box"></div><div class="box"></div><div class="box"></div>
                            </div>
                        </div>
                        <div class="track">
                            <div class="track-label" data-i18n-html="rolls.card2_track2"></div>
                            <div class="boxes">
                                <div class="box filled"></div><div class="box filled"></div><div class="box"></div><div class="box"></div><div class="box"></div>
                            </div>
                        </div>
                        <div class="track">
                            <div class="track-label" data-i18n-html="rolls.card2_track3"></div>
                            <div class="boxes">
                                <div class="box filled"></div><div class="box filled"></div><div class="box filled"></div><div class="box filled"></div><div class="box filled"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Section 3 -->
        <div class="card">
            <div class="card-left">
                <div class="number">3</div>
                <div class="card-icon"><i class="fa-solid fa-handshake"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="rolls.card3_title"></h3>
                <ul class="info-list" style="border-top: none;">
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-dharmachakra"></i></div>
                        <div data-i18n="rolls.card3_item1"></div>
                    </li>
                    <li>
                        <div class="info-icon info-icon-solid"><i class="fa-solid fa-shield-halved"></i></div>
                        <div data-i18n="rolls.card3_item2"></div>
                    </li>
                </ul>
            </div>
        </div>

        <!-- Section 4 -->
        <div class="card">
            <div class="card-left">
                <div class="number">4</div>
            </div>
            <div class="card-right" style="padding: 20px;">
                <div class="banner-content" data-i18n-html="rolls.card4_banner"></div>
            </div>
        </div>

        <!-- Section 5 -->
        <div class="card">
            <div class="card-left">
                <div class="number">5</div>
                <div class="card-icon"><i class="fa-regular fa-compass"></i></div>
            </div>
            <div class="card-right">
                <h3 class="card-title" data-i18n="rolls.card5_title"></h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th class="th-act" data-i18n="rolls.card5_th_act"></th>
                                <th class="th-react" data-i18n="rolls.card5_th_react"></th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-6"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_act_6"></div>
                                    </div>
                                </td>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-6 gold"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_react_6"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-5"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-4"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_act_54"></div>
                                    </div>
                                </td>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-5 gold"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-4 gold"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_react_54"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-3 red"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-2 red"><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-1 red"><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_act_321"></div>
                                    </div>
                                </td>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-3 red"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-2 red"><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-1 red"><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_react_321"></div>
                                    </div>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-4 white"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-4 white"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_act_doubles"></div>
                                    </div>
                                </td>
                                <td>
                                    <div class="dice-result">
                                        <div class="dice-group">
                                            <div class="die-face face-4 white"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                            <div class="die-face face-4 white"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
                                        </div>
                                        <div class="result-text" data-i18n-html="rolls.card5_react_doubles"></div>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>


        <div class="back-nav">
            <a href="../index.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i>
                <span data-i18n="common.back_index">Índice</span>
            </a>
        </div>

</body>
</html>
