<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="index.title"></title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="i18n/i18n.js" defer></script>
    <style>
        /* Portada-specific overrides */
        .cover {
            text-align: center;
        }

        .cover-img {
            width: 100%;
            max-width: 680px;
            border: 3px solid var(--dark-green);
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
            display: block;
            margin-bottom: 25px;
        }

        .index-card {
            background-color: var(--parchment);
            border: 3px solid var(--dark-green);
            border-radius: 8px;
            padding: 20px 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .index-card h3 {
            font-family: 'Cinzel', serif;
            color: var(--dark-green);
            font-size: 1.6rem;
            text-align: center;
            margin: 0 0 15px 0;
            letter-spacing: 1px;
        }

        .divider-small {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 0 20px 0;
            color: var(--gold);
            font-size: 0.9rem;
        }

        .divider-small::before, .divider-small::after {
            content: "";
            height: 1px;
            background: var(--gold);
            width: 80px;
            margin: 0 10px;
        }

        .index-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .index-list li {
            border-bottom: 1px dotted #aaa;
        }

        .index-list li:last-child {
            border-bottom: none;
        }

        .index-list a {
            display: flex;
            align-items: center;
            padding: 13px 10px;
            text-decoration: none;
            color: var(--text-dark);
            transition: background-color 0.2s, padding-left 0.2s;
            border-radius: 4px;
        }

        .index-list a:hover {
            background-color: rgba(214, 168, 72, 0.15);
            padding-left: 15px;
        }

        .index-num {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: var(--dark-green);
            color: var(--parchment);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lora', serif;
            font-size: 1.1rem;
            font-weight: bold;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .index-icon {
            color: var(--gold);
            font-size: 1.1rem;
            margin-right: 12px;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .index-text {
            flex-grow: 1;
            text-align: left;
            line-height: 1.3;
        }

        .index-text strong {
            font-family: 'Lora', serif;
            color: var(--dark-green);
            font-size: 1.05rem;
        }

        .index-text span {
            display: block;
            font-size: 0.8rem;
            color: #666;
        }

        .index-arrow {
            color: var(--gold);
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .coming-soon {
            opacity: 0.5;
            cursor: default;
            pointer-events: none;
        }

        .lang-switch {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        .lang-btn {
            border: 2px solid var(--dark-green);
            background: var(--parchment);
            border-radius: 6px;
            padding: 4px 6px;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }

        .lang-btn img {
            width: 28px;
            height: 18px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="cheat-sheet cover">

        <!-- Cover image -->
        <img src="img/portada.png" class="cover-img" data-i18n-attr="alt:index.cover_alt">

            <span class="subtitle-top" data-i18n="common.the"></span>
            <h1 data-i18n="common.wildsea"></h1>
            <div class="divider"><i class="fa-solid fa-compass"></i></div>
            <div class="subtitle-bottom" data-i18n="index.subtitle_bottom"></div>
            <h2 data-i18n="index.h2"></h2>
            <div class="lang-switch">
                <button type="button" class="lang-btn" data-lang-button="es" data-i18n-attr="aria-label:common.lang_es">
                    <img src="img/flag-es.svg" alt="">
                </button>
                <button type="button" class="lang-btn" data-lang-button="en" data-i18n-attr="aria-label:common.lang_en">
                    <img src="img/flag-en.svg" alt="">
                </button>
            </div>
        </div>

            </ul>
        </div>

    </div>

</body>
